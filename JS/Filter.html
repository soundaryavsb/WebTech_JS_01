<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=[10,20,30,70,100,300,600,900,800];
        
        let a=num.filter(a=>a>300);
        console.log(a);

        let b=num.filter(minMax=>minMax<20||minMax>600);
        console.log(b);

        //Max and Min
        //Without filter:
        console.log("Max: "+Math.max(...num));
        console.log("Min: "+Math.min(...num));

        //With Filter
        let min=num.filter(a=>a===Math.min(...num));
        console.log("Filter - Min Only: "+min);

        let max=num.filter(a=>a===Math.max(...num));
        console.log("Filter - Max Only: "+max);

        let minMax=num.filter(a=>a===Math.min(...num)||a===Math.max(...num));
        console.log("Filter - Min and Max value: "+minMax);
        console.log(minMax);

        //filter in STRING
        let fruits=["Apple","Banana","Mango","PipeApple","Watermelon"];

        let c=fruits.filter((m)=>m=="Apple")
        console.log(c);

        let d=fruits.filter((n)=>n<"C");
        console.log(d);

        let e=fruits.filter((x)=>x<"Mango");
        console.log(e);

        let f=fruits.filter((y)=>y=="Apple" || y=="Watermelon");
        console.log(f);

    </script>
</body>
</html>
