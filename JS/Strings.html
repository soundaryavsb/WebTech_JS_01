<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //String
        let str="Soundarya is a Software Engineer";

        //1. Length
        console.log("-----My String: "+str+"-----");
        console.log("Length: "+str.length);
        console.log(typeof str);

        //2. Concat
        console.log("-----My String: "+str+"-----");
        console.log(str.concat(" and Automation Tester"));
        
        //3. Replace
        console.log("-----My String: "+str+"-----");
        console.log(str.replace("Engineer","Associate"));

        //4.toUpperCase
        console.log("-----My String: "+str+"-----");
        console.log((str.toUpperCase()));

        //5.toLowerCase
        console.log("-----My String: "+str+"-----");
        console.log(str.toLowerCase());
        
        //6.slice
        console.log("-----My String: "+str+"-----");
        console.log(str.slice(0,9));

        //7.indexOf
        console.log("-----My String: "+str+"-----");
        console.log(str.indexOf("r"));

        //8.lastIndexOf
        console.log("-----My String: "+str+"-----");
        console.log(str.lastIndexOf("n"));
        
        //9.trimStart
        let str1="         Hello   "
        console.log("-----My String: "+str1+"-----");
        console.log("Length Before trim: "+str1.length);
        console.log(str1.trimStart());
        console.log("Length After trimStart: "+str1.trimStart().length);
        
        //10.trimEnd
        console.log("-----My String: "+str1+"-----");
        console.log(str1.trimEnd());
        console.log("Length After trimEnd: "+str1.trimEnd().length);
        
        //11.repeat
        console.log("-----My String: "+str+"-----");
        console.log(str.repeat(3));

        //12.includes
        console.log("-----My String: "+str+"-----");
        console.log(str.includes("Soft"));
        console.log(str.includes("Hard"));
        
        //13.match
        console.log("-----My String: "+str+"-----");
        console.log(str.match("Soft"));
        console.log(str.match("H"));
        
        //14.charAt
        console.log("-----My String: "+str+"-----");
        console.log(str.charAt(0));
        console.log(str.charAt(19));
        
        //15.charCodeAt
        console.log("-----My String: "+str+"-----");
        console.log(str.charCodeAt(0));
        console.log(str.charCodeAt(19));

        //16.padStart
        let str2="Sivan";
        console.log("-----My String: "+str2+"-----");
        console.log(str2.padStart(19,"Sakthi"));

        //17.padEnd
        let str3="Rahul";
        console.log("-----My String: "+str3+"-----");
        console.log(str3.padEnd(12,"Arya"));
    </script>
</body>
</html>
