<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //String
        let str="Soundarya";
        console.log(str);
        console.log(typeof str);
        //Number
        let num=10;
        console.log(num);
        console.log(typeof num);
        //Boolean
        let boo=true;
        console.log(boo);
        console.log(typeof boo);
        //BigInt
        let bint=2345n;
        console.log(bint);
        console.log(typeof bint);
        //Undefined
        let unD=undefined
        console.log(unD);
        console.log(typeof unD);
        //Null
        let nu=null
        console.log(nu);
        console.log(typeof nu);
        //Symbol
        let sym=Symbol;
        console.log(sym);
        console.log(typeof sym);
        let sym2=Symbol();
        console.log(sym2);
        console.log(typeof sym2);
        //Array
        let arr=[23,76,45,91,37];
        console.log(arr);
        console.log(typeof arr);
        //Object
        let obj={
            Name:"Sai",
            age:27,
            city:"Nellore",
            state:"Ap"
        }
        console.log(obj);
        console.log(typeof obj);
    </script>
</body>
</html>
