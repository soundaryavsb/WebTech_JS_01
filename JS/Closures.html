<body>
    <script>
        // Example 1:
        function Outer(){
            let Count=0
            return function Inner(){
                Count++;
                console.log(Count);
            }
        }
        let a=Outer();
        a();
        a();
        a();
        //Example 2:
        function OuterFunction(){
            let OuterVariable="I am Outer..."
            function InnerFunction(){
                console.log(OuterVariable);
            }
            return InnerFunction
        }
        let b=OuterFunction();
        b();
        b();
    </script>
