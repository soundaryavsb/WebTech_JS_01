<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
        //Fetch data from url - json data
        // Example 1:
        async function fetchData() {
            try {
                //All data
                let response=await fetch("https://jsonplaceholder.typicode.com/posts");
                let data=await response.json();
                console.log(data);

                //Single data
                let response2=await fetch("https://jsonplaceholder.typicode.com/posts/1");
                let data2=await response2.json();
                console.log(data2);

            } catch (error) {
                console.log("Error Message");
            }
        }
        fetchData();
        
        //Example 2:
        async function FetchJson2(params) {

            console.log(data);
         } catch (error) {
            console.log("FetchJson error messgae");
         }   
        }
        FetchJson2();

    </script>
</body>
