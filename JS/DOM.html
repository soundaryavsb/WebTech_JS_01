<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM in JS</title>
</head>
<body>
    <div id="parent">
        <h1 id="demo">Arya</h1>
        <p id="riya">Riya</p>
        <h2 class="cls" id="last">Banu</h2>
        <p id="rahul">Rahul</p>
        <p class="cls" id="soundarya">Soundarya</p>
        <h2 class="cls" id="ravi">Ravi</h2>
        <p>Tara</p>
    </div>
    <script>
        //DOM methods
        //1. document.getElementById()
        let a=document.getElementById("demo");
        console.log(a);

        //2. document.getElementsByClassName()
        let b=document.getElementsByClassName("cls");
        console.log(b);

        // 3. document.getElementsByTagName()
        let c=document.getElementsByTagName("p");
        console.log(c);

        //4. document.querySelector();
        let d=document.querySelector("p");
        console.log(d);

        //5. document.querySelectorAll();
        let e=document.querySelectorAll("p");
        console.log(e);

        //DOM properties
        //1. document.head
        console.log(document.head);
        //2. document.body
        console.log(document.body);
        //3. document.title
        console.log(document.title);
        
        //DOM Manipulation
        //1. Creating an Element - document.createElement()
        let n=document.createElement("h1");
        console.log(n);

        //2. Adding an Text - innerText - property
        n.innerText="M S Dhoni";
        console.log(n);

            //Example 2:
            let m=document.createElement("p");
            console.log(m);
            m.innerText="Suresh Raina";
        
        //3. Adding an Element in DOM - AppendChild()
        let parent=document.getElementById("parent");
        console.log(parent);

        parent.appendChild(n);
        parent.appendChild(m);
        console.log(parent);

        //4. Remove an Element from DOM - remove();
        let last=document.getElementById("last");
        console.log(last);
        last.remove();
        console.log(parent);

        m.remove();
        console.log(parent);
        
        //5. Inserting an Element - insertBefore();
        console.log(parent);

        a=document.getElementById("demo");
        console.log(a);
        parent.insertBefore(n,a);
        console.log(parent);

        let Soundarya=document.getElementById("soundarya");
        console.log(Soundarya);
        let Riya=document.getElementById("riya");
        console.log(Riya);
        parent.insertBefore(Soundarya,Riya);
        console.log(parent);

        //6. Replacing an Element
        let Rahul=document.getElementById("rahul");
        console.log(Rahul);
        a=document.getElementById("demo");
        console.log(a);
        a.replaceChildren(Rahul);
        console.log(parent);
        
        //Difference between InnerText and innerHTML
        //InnerText:
        console.log(parent.innerText);
        //InnerHTML
        console.log(parent.innerHTML);

        //Styling in JS:
        //Target entire body
        document.body.style.color="red";
        document.body.style.backgroundColor="yellow";
        document.body.style.textAlign="center";
        document.body.style.border="20px double blue";
        document.body.style.borderRadius="50px";

        //Target perticular element
        n.style.color="white";
        n.style.backgroundColor="black";
        n.style.padding="20px";
        n.style.borderRadius="15px";
        n.style.textDecorationLine="underline"
        
    </script>
</body>
</html>
