<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //1. Example 1:
        let marks=85;
        //Creating an promise
        let myPromises=new Promise((resolve,reject)=>{
            if(marks>=90){
                resolve("You will get a bike");
            }
            else{
                reject();
            }
        });
        //Handling the promise by using async and await
        async function demo() {
            try{
                let result=await myPromises;
                console.log(result); 
            }catch(error){
                console.log("Better luck next time beta");
            }finally{
                console.log("I am marks ASYNC and AWAIT finally block");
            }
        }
        demo();

        //Example 2:
       let network="Yes";
       //Creating a promise
       let networkStatus=new Promise((resolve,reject)=>{
        if(network=="Yes"){
            resolve("Network Available");
        }
        else{
            reject("Network not available");
        }
       })
       //Handling a promise by using Async and Await
       async function demo2() {
       try{
            let result=await networkStatus;
            console.log(result);
            // console.log("Network Available");
       }catch(error){
            console.log("Network not available");
       }finally{
        console.log("I am network finally block");
       }
       }
       demo2();

       console.log("Hii");
       console.log("Hello");
       console.log("Heyyy");
    </script>
</body>
</html>
