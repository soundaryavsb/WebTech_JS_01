<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //1. Create Object using Object Constructor Way:
        let a=new Object();
        a.name="Arya"
        a.age=27
        a.city="Uganda"
        a.country="West Indies"
        console.log(a);
        
        //2. Create Object using Object Literals Way
        let obj={
            name:"Rahul",
            age:28,
            City:"Chennai",
            State:"TN"
        }
        console.log(obj);
        
        //Inorder to get single value separately from the entity
        console.log(obj);
        console.log(obj.name);
        console.log(obj.age);
        console.log(obj.State);
        
        //Inorder to add a single value inside the object we should use DOT notation W.R.T(with respect to) KEY
        console.log(obj);
        obj.country="India"
        console.log(obj);
        obj.food="Rice"
        console.log(obj);

        //Inorder to remove or delete an entity from the entire object we should use DELETE method W.R.T KEY
        console.log(obj);
        delete obj.City;
        console.log(obj);
        delete obj.food;
        console.log(obj);

        //Nested Object in JS
        //Example 1:
        let person={
            name:"Raya",
            age:56,
            address:{
                city:"Chennai",
                state:"TN",
                pincode:639113,
            },
            food:{
                rice:"Sambar Rice",
                sweet:"Rasagulla"
            },
            color:"green"
        }
        console.log(person);
        console.log(person.address);
        console.log(person.address.state);
        console.log(person.address.pincode);
        console.log(person.food);
        console.log(person.food.rice);
        console.log(person.color);

        //Combination of Object with Array
        let Person={
            name:"Soundarya",
            age:28,
            skills:["Drawing","Silambam","Testing"],
            city:"Karur",
            address:{
                place:"Karur",
                pincode:639113,
                food:{
                    rice:"Curd rice",
                    icecream:"Vannila",
                    sports:["Cricket","Valley Ball","Kabaddi"]
                },
            },
            country:"India"
        }
        console.log(Person);
        console.log(Person.age);
        console.log(Person.skills);
        console.log(Person.skills[0]);
        console.log(Person.skills[2]);
        console.log(Person.address);
        console.log(Person.address.pincode);
        console.log(Person.address.food.rice);
        console.log(Person.address.food.sports);
        console.log(Person.address.food.sports[1]);
        console.log(Person.country);
        
        
        
        
        
        
        
        
        
        
        

        
        
        
        
        
        
        
        

        
        
        
        
        
        
        
        
        //Nested Objects

    </script>
</body>
</html>
