<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Script>
        //For loop
        console.log("--------for loop------");
        for(let i=1;i<=10;i++)
        {
            console.log(i);
        }
        for(let i=45;i<=50;i++)
        {
            console.log(i);
        }
        //While loop
        console.log("--------While loop------");
        let m=50;
        while (m<=55) {
            console.log(m);
            m++;
        }
        let n=20
        while (n<=23) {
            console.log(n);
            n++;
        }
        //Do-While loop
        console.log("--------Do-While loop------");
        let x=50;
        do{
            console.log(x);
        }while(x<20)
        let y=10
        do {
            console.log(y);
            y++;
        } while (y<=13);
    </Script>
</body>
</html>
