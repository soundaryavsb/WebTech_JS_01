<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //5. IIFE (Immediate Invoke Function Expression)
            (function(){
                console.log("I am IIFE");
            })();

            (function(){
                console.log("I am IIFE 2");
            })();
        //1. Named function
            function Raju() {
                console.log("I am Raju");
            }
            Raju();

            //Addition
            function add(a,b) {
                return a+b;
            }
            console.log(add(10,20));
            let x=add(100,200);
            console.log(x);
            
            //Subtraction
            function sub(a,b) {
                return a-b;
            }
            console.log(sub(20,10));
            let y=sub(200,100);
            console.log(y);
            
            //Multiplication
            function mul(a,b) {
                a*b;
            }
            console.log(mul(20,10));
            let z=mul(200,100);
            console.log(z);

        //2. Function Expression
            let a=function Mintu(){
                console.log("I am Mintu");
            }
            a();

            let b=function Chintu(){
                console.log("I am chintu");
            }
            b();

        //3. Anonymous function
            let c=function(){
                console.log("I am Anonymous function");
            }
            c();

            let d=function(){
                console.log("I am Anonymous function 2");
            }
            d();

        //4. Nested function
            function parent(){
                console.log("I am parent");
                child();
                function child(){
                    console.log("I am child");
                }
                child();
            }
            parent()

            function time(){
                console.log("I am time");
                function past() {
                    console.log("I am past");
                }
                past();
                function future() {
                    console.log("I am future");
                }
                future();
                console.log("Focus to present and control it");
            }
            time();
        //6. Arrow Function
            //With Return
            let a1=()=>{
                return "Hello";
            }
            console.log(a1());
                // [or]
            let a11=a1();
            console.log(a1());
            
            //Without Return
            let b1=()=>"Ready";
            console.log(b1());
                // [or]
            let b11=b1();
            console.log(b11);
            
            //Returning a single value by using Arrow function with Return
            let c1=(c)=>{
                return c
            }
            console.log(c1(59));
                // [or]
            let c11=c1(1000);
            console.log(c11);

            //Returning a single value by using Arrow function without Return
            let d1=(d)=>{
                return d;
            }
            console.log(d1(259));
                // [or]
            let d11=d1(359);
            console.log(d11);
            
            //perform an operation with one unknown by using arrow function with return
            let e1=(e)=>{
                return e+100;
            }
            console.log(e1(377));
                // [or]
            let e11=e1(477);
            console.log(e11);
            
            //perform an operation with one unknown by using arrow function without return
            let f1=(f)=>f-20;
            console.log(f1(810));
                // [or]
            let f11=f1(710);
            console.log(f11);
            
            //perform an operation with two unknown by using arrow function with return
            let g1=(a,b)=>{
                return a+b;
            }
            console.log(g1(12,13));
                // [or]
            let g11=g1(75,28);
            console.log(g11);
            
            //perform an operation with one unknown by using arrow function without return
            let h1=(a,b)=>a-b;
            console.log(h1(25,16));
                // [or]
            let h11=h1(71,60);
            console.log(h11);
        //7. Call back Function
        function Mintu(a){
            console.log("I am mintu");
            a();
        }
        Mintu(function chottu(){
            console.log("I am chottu");
        })

        function Right(a,b){
            console.log("I am Right");
            a();
            b();
        }
        Right(function Rav(){
            console.log("I am Rav");
        },function Sony(){
            console.log("I am Sony");
        })

        //8. H.O.F. Higher Order Function
        function calculate(a){
            return a+1000;
        }
        function bonus(m,n){
            let res=m(n);
            console.log(res);
        }
        bonus(calculate,1500);

        function cal(a){
            return a+500;
        }
        function bon(m){
            let res=m(800);
            console.log(res);
            console.log(m(12));
        }
        bon(cal);
    </script>
</body>
</html>
