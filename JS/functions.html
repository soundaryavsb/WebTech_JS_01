<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //1. Named function
            function Raju() {
                console.log("I am Raju");
            }
            Raju();

            //Addition
            function add(a,b) {
                return a+b;
            }
            console.log(add(10,20));
            let x=add(100,200);
            console.log(x);
            
            //Subtraction
            function sub(a,b) {
                return a-b;
            }
            console.log(sub(20,10));
            let y=sub(200,100);
            console.log(y);
            
            //Multiplication
            function mul(a,b) {
                a*b;
            }
            console.log(mul(20,10));
            let z=mul(200,100);
            console.log(z);
    </script>
</body>
</html>
