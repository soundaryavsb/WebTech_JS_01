<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //Arithmetic operator
        let a=60;
        let b=30;
        console.log(a+b);
        console.log(a-b);
        console.log(a*b);
        console.log(a/b);
        console.log(a%b);
        let c=3;
        let d=2;
        console.log(c*d);
        console.log(c**d);
        c=4;
        console.log(c*d);
        console.log(c**d);
        //Comparison or Relational Operator
        let m=80;
        let n=40;
        console.log(m>n);
        console.log(m<n);
        console.log(m>=n);
        console.log(m<=n);
        console.log(m!=n);
        console.log(m==n);
        //Logical Operator
        //AND - &&
        let p=180;
        let q=60;
        console.log(p>q&&p<q);
        console.log(q>p&&p<q);
        console.log(p!=q&&p==q);
        console.log(p>q&&q<p);
        console.log(p>=q&&p<=q);
        //OR - ||
        p=100;
        q=60;
        let u=p>q;
        let v=q<p;
        console.log(u||v);
        console.log((p==q||p<=q));
        console.log(p>q||p<q);
        console.log(q>p||p<=q);
        console.log(p!=q||q<=p);
        //NOT - !
        p=100;
        q=60;
        console.log(p>q&&!(p<q));
        console.log(p!=q&&!(p==q));
        console.log(!(p>q)||p<q);
        console.log(q>p||!(p==q));
        //Assignment Operator
        let j=80;
        let k=50;
        console.log(j=j+k);
        console.log(j+=k);
        console.log(j=j-k);
        console.log(j-=k);
        console.log(j=j*k);
        console.log(j*=k);
        //Ternary Operator
        let x=200;
        let y=100;
        let big=x>y?x:y;
        console.log(big);
        let small=y>x?x:y;
        console.log(small);
    </script>
</body>
</html>
