<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //1. Example 1:
        let marks=95;
        //Creating an promise
        let myPromises=new Promise((resolve,reject)=>{
            if(marks>=90){
                resolve();
            }
            else{
                reject();
            }
        });
        //Handling the promise
        myPromises
        .then((resolve)=>{
            console.log("You will get a bike");
            
        })
        .catch((reject)=>{
            console.log("Better luck next time");
            
        })
        .finally(()=>{
            console.log("I am finally bolck");
        })
        console.log("Hi");
        console.log("Hello");
        console.log("bye");
        
       //Example 2:
       let network="Yes";
       //Creating a promise
       let networkStatus=new Promise((resolve,reject)=>{
        if(network=="Yes"){
            resolve("Network Available");
        }
        else{
            reject("Network not available");
        }
       })
       //Handling a promise
       networkStatus
       .then((resolve)=>{
            console.log("Network Available");
       })
       .catch((reject)=>{
            console.log("Network not available");
       })
       .finally(()=>{
        console.log("I am network finally block");
       })
    </script>
</body>
</html>
